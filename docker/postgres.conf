# Frozen PostgreSQL settings for Rebound trials. Changing any value changes the config hash.
listen_addresses = '*'
max_connections = 40
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB
random_page_cost = 1.1
# JIT compilation adds run-to-run variance on short analytical queries.
jit = off
synchronous_commit = on
wal_level = minimal
max_wal_senders = 0
checkpoint_timeout = 15min
max_wal_size = 2GB
track_io_timing = on
log_min_duration_statement = -1
timezone = 'UTC'
