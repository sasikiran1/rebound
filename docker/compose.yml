# System under test: postgres <- toxiproxy <- fielddesk.
# FieldDesk reaches PostgreSQL only through the toxiproxy "pg" proxy.
# Host ports bind to 127.0.0.1 only. Passwords are local-dev defaults for synthetic data.
name: rebound

x-pg-env: &pg-env
  PGUSER: fielddesk
  PGPASSWORD: ${FIELDDESK_DB_PASSWORD:-fielddesk}

services:
  postgres:
    # postgres:16 (16.15)
    image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FIELDDESK_DB_PASSWORD: ${FIELDDESK_DB_PASSWORD:-fielddesk}
      ORACLE_DB_PASSWORD: ${ORACLE_DB_PASSWORD:-oracle}
    volumes:
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      # Direct access for the oracle (read-only role) and admin tasks; bypasses toxiproxy.
      - "127.0.0.1:55432:5432"
    cpuset: "2-3"
    mem_limit: 2g
    shm_size: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  toxiproxy:
    # ghcr.io/shopify/toxiproxy:2.12.0
    image: ghcr.io/shopify/toxiproxy@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"    # control API
      - "127.0.0.1:15432:15432"  # pg proxy, for the canary query
    cpuset: "6"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  fielddesk:
    build:
      context: ..
      dockerfile: docker/fielddesk.Dockerfile
    environment:
      <<: *pg-env
      PGHOST: toxiproxy
      PGPORT: "15432"
      PGDATABASE: ${FIELDDESK_DB:-fielddesk_trial}
      POOL_SIZE: ${POOL_SIZE:-8}
      GATE_ENABLED: ${GATE_ENABLED:-false}
      GATE_TOKENS: ${GATE_TOKENS:-8}
      GATE_QUEUE_MAX: ${GATE_QUEUE_MAX:-16}
      GATE_QUEUE_WAIT_MS: ${GATE_QUEUE_WAIT_MS:-1500}
      GATE_RETRY_AFTER_S: ${GATE_RETRY_AFTER_S:-2}
      AGENT_POLICY: ${AGENT_POLICY:-off}
      PROBE_REFUSE_FIRST: ${PROBE_REFUSE_FIRST:-0}
      REQUEST_LOG: /logs/backend.jsonl
      SAMPLE_LOG: /logs/samples.jsonl
    volumes:
      - ../var/fielddesk:/logs
    ports:
      - "127.0.0.1:8080:8080"
    cpuset: "4-5"
    mem_limit: 2g
    depends_on:
      - toxiproxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Resolve (opt-in: `docker compose -f docker/compose.yml --profile resolve up -d`). Its store is the `resolve`
  # schema in the trial database, reached directly, not through Toxiproxy: a FieldDesk outage does not take it down.
  resolve-worker:
    profiles: ["resolve"]
    build:
      context: ..
      dockerfile: docker/resolve.Dockerfile
    image: rebound-resolve
    environment: &resolve-env
      RESOLVE_SMTP_HOST: ${RESOLVE_SMTP_HOST:-resolve-mail}
      RESOLVE_SMTP_PORT: ${RESOLVE_SMTP_PORT:-1025}
      RESOLVE_CALDAV_URL: ${RESOLVE_CALDAV_URL:-http://resolve-calendar:5232/fielddesk/}
      RESOLVE_CALDAV_USER: ${RESOLVE_CALDAV_USER:-fielddesk}
      RESOLVE_CALDAV_PASSWORD: ${RESOLVE_CALDAV_PASSWORD:-local-only}
      REBOUND_PG_HOST: postgres
      REBOUND_PG_PORT: "5432"
      REBOUND_FIELDDESK_URL: http://fielddesk:8080
      FIELDDESK_DB: ${FIELDDESK_DB:-fielddesk_trial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ORACLE_DB_PASSWORD: ${ORACLE_DB_PASSWORD:-oracle}
    command: ["python", "-m", "resolve.worker"]  # owner = host + pid: unique per replica
    # Questions and outcomes go out by SMTP. Locally to the test inbox below; a real provider is a change of
    # RESOLVE_SMTP_HOST / PORT / USER / PASSWORD.
    stop_grace_period: 15s  # SIGTERM: finish the request in hand, then exit
    depends_on:
      postgres:
        condition: service_healthy
      fielddesk:
        condition: service_healthy

  # Local test inbox: receives every customer message over SMTP and stores it (var/mail/inbox.jsonl); relays nothing.
  resolve-mail:
    profiles: ["resolve"]
    image: rebound-resolve
    command: ["python", "-m", "resolve.eval.mailsink", "--port", "1025", "--inbox", "/mail/inbox.jsonl"]
    user: "0"  # writes to the bind-mounted var/mail
    volumes:
      - ../var/mail:/mail

  # Technicians' calendars over CalDAV (Radicale). Booked appointments are mirrored here; any calendar client can
  # subscribe to http://127.0.0.1:5232/fielddesk/tech-<id>/ (login fielddesk / RESOLVE_CALDAV_PASSWORD).
  resolve-calendar:
    profiles: ["resolve"]
    image: rebound-resolve
    command: ["python", "-m", "resolve.eval.calserver", "--host", "0.0.0.0", "--port", "5232",
              "--folder", "/calendar"]
    environment:
      RESOLVE_CALDAV_PASSWORD: ${RESOLVE_CALDAV_PASSWORD:-local-only}
    user: "0"  # writes to the bind-mounted var/calendar
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - ../var/calendar:/calendar

  resolve-service:
    profiles: ["resolve"]
    image: rebound-resolve
    environment:
      <<: *resolve-env
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      RESOLVE_MODEL: ${RESOLVE_MODEL:-muse-spark-1.3}
      RESOLVE_MAX_CALLS: ${RESOLVE_MAX_CALLS:-50}
      RESOLVE_MAX_COST: ${RESOLVE_MAX_COST:-1.00}
      RESOLVE_CONFIRM: ${RESOLVE_CONFIRM:-true}
    command: ["uvicorn", "resolve.app:app", "--host", "0.0.0.0", "--port", "8090", "--no-access-log"]
    ports:
      - "127.0.0.1:8091:8090"  # no authentication: localhost only
    depends_on:
      resolve-worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
