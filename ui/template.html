<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebound results</title>
<style>
:root{--bg:#f7f6f3;--panel:#fff;--ink:#1c1c1a;--muted:#65635d;--line:#e3e1da;--off:#b4532a;--on:#1f5fbf;--good:#237a50;--bad:#b3302c;--warn:#94660a;--soft:#efede7;--band:#f4e3d8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16171a;--panel:#1f2024;--ink:#ecebe7;--muted:#a3a19a;--line:#33343a;--off:#e38a5f;--on:#79aef2;--good:#5cc28f;--bad:#ee8580;--warn:#dcb25c;--soft:#2a2b30;--band:#40302a}}
:root[data-theme=dark]{--bg:#16171a;--panel:#1f2024;--ink:#ecebe7;--muted:#a3a19a;--line:#33343a;--off:#e38a5f;--on:#79aef2;--good:#5cc28f;--bad:#ee8580;--warn:#dcb25c;--soft:#2a2b30;--band:#40302a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1120px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:28px;min-height:60px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{all:unset;cursor:pointer;padding:8px 12px;border-radius:6px;color:var(--muted);font-size:15px}
nav button:hover{background:var(--soft);color:var(--ink)}
nav button[aria-selected=true]{background:var(--soft);color:var(--ink);font-weight:600}
nav button:focus-visible,.seg button:focus-visible,th button:focus-visible{outline:2px solid var(--on);outline-offset:1px}
.tag{margin-left:auto;font-size:13px;color:var(--muted)}
main{max-width:1120px;margin:0 auto;padding:32px 24px 64px}
h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;margin:0 0 10px;max-width:24em}
h2{font-size:21px;letter-spacing:-.01em;margin:36px 0 10px}
p{margin:0 0 12px;max-width:44em}
.lead{font-size:18px;color:var(--muted);max-width:40em;margin-bottom:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px;margin:20px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.card .k{font-size:14px;color:var(--muted)}
.card .v{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.card .s{font-size:14px;color:var(--muted)}
.off{color:var(--off)}.on{color:var(--on)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin:16px 0}
.controls{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 11px;border-radius:6px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.legend{display:flex;gap:18px;font-size:14px;color:var(--muted);flex-wrap:wrap;margin:6px 0}
.legend i{display:inline-block;width:18px;height:3px;margin-right:6px;vertical-align:middle}
svg text{fill:var(--muted);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:13px}
th button{all:unset;cursor:pointer}
td.wrap{white-space:normal;min-width:190px}
.pill{display:inline-block;border-radius:5px;padding:1px 8px;font-size:13px;font-weight:600}
.pass{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.fail{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.note{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.crit{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.crit:last-child{border:0}
.crit b{color:var(--muted);font-size:14px}
.crit small{display:block;color:var(--muted);font-size:14px}
.step{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.step time{color:var(--muted);font-variant-numeric:tabular-nums}
.say{color:var(--muted);font-style:italic}
.wrongly{color:var(--warn);font-size:13px;font-weight:600;margin-left:6px}
.foot{font-size:14px;color:var(--muted);margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:6px;display:none;z-index:9;line-height:1.4}
@media (max-width:640px){.top,main{padding-left:16px;padding-right:16px}h1{font-size:25px}.tag{display:none}}
</style>
</head>
<body>
<header><div class="top">
  <div class="brand">Rebound</div>
  <nav role="tablist" aria-label="Views" id="nav"></nav>
  <div class="tag">Recorded evaluation · read-only</div>
</div></header>
<main id="view"></main>
<div class="tip" id="tip"></div>
<script>
const D = /*__DATA__*/null;
const $ = (s, r = document) => r.querySelector(s);
const fmt = n => n == null ? "—" : Number(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T = D.trials;
const pick = (f) => T.filter(f);
const agent = (gate, fs, b) => T.find(t => t.condition === "agent" && t.gate === gate && t.fault_on && t.fault_s === fs && t.block === b);
const blocks = [1, 2, 3];
const off10 = blocks.map(b => agent("off", 10, b)), on10 = blocks.map(b => agent("on", 10, b));
const off20 = T.find(t => t.label === "unfamiliar-agent-gate-off"), on20 = T.find(t => t.label === "unfamiliar-agent-gate-on");
const span = (arr, k) => { const v = arr.map(t => t[k]); const a = Math.min(...v), b = Math.max(...v); return a === b ? fmt(a) : `${fmt(a)}–${fmt(b)}`; };
const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
const scriptedOn = pick(t => t.condition === "scripted" && t.gate === "on");
const agentsOn = [...on10, on20];

const views = {
  overview() {
    const early = sum(agentsOn, t => t.too_early), sig = sum(agentsOn, t => t.followed);
    const sEarly = sum(scriptedOn, t => t.too_early), sSig = sum(scriptedOn, t => t.followed);
    const lostCut = Math.round((1 - sum(on10, t => t.lost) / sum(off10, t => t.lost)) * 100);
    const crit = [
      ["C1", "Healthy overhead", "Gate changes nothing measurable when the system is healthy.", "pass", "Pass"],
      ["C2", "Recovery", `Without the gate: ${span(off10, "t_rec")} s. With it: ${span(on10, "t_rec")} s. Both count as fast, so the gate is not needed at 10 s.`, "pass", "Pass · gate not needed"],
      ["C3", "Useful work", `Correct goals ${off10[0].correct} → ${on10[0].correct} of ${on10[0].goals} in each block; the limit is −3.`, "pass", "Pass"],
      ["C4", "Ordinary users", `Lost requests ${span(off10, "lost")} → ${span(on10, "lost")}.`, "pass", "Pass"],
      ["C5", "Unfamiliar 20 s fault", `Recovery ${off20.t_rec} → ${on20.t_rec} s and lost requests ${fmt(off20.lost)} → ${fmt(on20.lost)}, but correct goals ${off20.correct} → ${on20.correct}, beyond the limit. The stricter analyzer says insufficient evidence: this pair differs by one spend-cap field.`, "fail", "Fail · insufficient evidence"],
    ];
    return `<h1>Do AI agents slow an API's recovery, and does an admission gate help?</h1>
    <p class="lead">Real Meta Muse Spark agents did real scheduling work while a database slowdown hit the API. ${T.length} frozen trials, all valid, measured on the server and checked by SQL.</p>
    <div class="cards">
      <div class="card"><div class="k">Recovery after a 10 s fault</div><div class="v"><span class="off">${span(off10, "t_rec")} s</span> → <span class="on">${span(on10, "t_rec")} s</span></div><div class="s">Gate off → on. 10 s is the metric's floor.</div></div>
      <div class="card"><div class="k">Lost ordinary-user requests</div><div class="v">−${lostCut}%</div><div class="s">10 s fault, ${span(off10, "lost")} → ${span(on10, "lost")}</div></div>
      <div class="card"><div class="k">Correct agent goals lost to the gate</div><div class="v">${off10[0].correct - on10[0].correct} · ${off20.correct - on20.correct}</div><div class="s">per trial at 10 s · at 20 s, of ${on10[0].goals} scheduled</div></div>
      <div class="card"><div class="k">Retry-After ignored by agents</div><div class="v">${Math.round(early / sig * 100)}%</div><div class="s">${early} of ${sig} refusals. Scripted client: ${sEarly} of ${sSig}.</div></div>
    </div>
    <h2>What this shows</h2>
    <p><b>A short fault doesn't need the gate; a longer one does, at a cost.</b> At 10 s the API recovers quickly on its own. At 20 s it recovers slowly without the gate, and the gate halves lost service but costs correct agent work.</p>
    <p><b>Agents don't wait when told to.</b> They ignored the server's Retry-After every time. Agents were at most ${(Math.max(...agentsOn.map(t => t.goal_share)) * 100).toFixed(1)}% of in-flight load during the fault, and the gate's effect is the same with no agents present. <b>We do not claim that agents delay recovery:</b> this load was too light on agents to show it either way.</p>
    <h2>Acceptance criteria, fixed before the first trial</h2>
    <div class="panel">${crit.map(c => `<div class="crit"><b>${c[0]}</b><div>${c[1]}<small>${c[2]}</small></div><span class="pill ${c[3]}">${c[4]}</span></div>`).join("")}</div>`;
  },

  recovery() {
    return `<h1>Recovery, second by second</h1>
    <p class="lead">Each line is one recorded trial. The shaded band is the injected database latency.</p>
    <div class="panel">
      <div class="controls">
        <div class="seg" id="runSeg" role="group" aria-label="Fault and block">${[["1","10 s · block 1"],["2","10 s · block 2"],["3","10 s · block 3"],["20","20 s fault"]].map((o, i) => `<button data-v="${o[0]}" aria-pressed="${i === 0}">${o[1]}</button>`).join("")}</div>
        <div class="seg" id="metSeg" role="group" aria-label="Measure">${[["success","Ordinary users served"],["p95","Slowest 5% of requests"],["inflight","Requests in flight"]].map((o, i) => `<button data-v="${o[0]}" aria-pressed="${i === 0}">${o[1]}</button>`).join("")}</div>
      </div>
      <div class="legend"><span><i style="background:var(--off)"></i>Gate off</span><span><i style="background:var(--on)"></i>Gate on</span><span><i style="background:var(--band);height:10px"></i>Fault active</span></div>
      <div id="chart"></div>
      <p id="p95note" class="foot" style="display:none;margin-top:10px">During the fault, gate-on latency drops because refused requests return at once. That is not service: nearly all of them were turned away. Use "Ordinary users served" to compare service.</p>
    </div>
    <div class="cards" id="runCards"></div>
    <p class="foot">How to read recovery time: health is judged over the previous 10 s, so a system that recovers instantly still scores about 10 s. Sustained health for 60 s is required. Lost requests are shown beside it because recovery time alone doesn't say how much service was lost.</p>`;
  },

  agents() {
    const R = D.replay;
    const rows = [...agentsOn.map(t => ["Agents", t]), ...scriptedOn.map(t => ["Scripted client", t])];
    const refusals = R.steps.filter(s => s.kind === "http" && s.status === 503).length;
    return `<h1>Agents don't wait when the server says wait</h1>
    <p class="lead">When the gate refuses a request it says "retry after 2 seconds". A correct client waits. These agents never did: their next request came a median of ${agentsOn[0].gap_p50.toFixed(1)} s later.</p>
    <div class="panel"><div class="scroll"><table><thead><tr><th>Client</th><th>Trial</th><th>Fault</th><th>Refusals followed by a request</th><th>Sent too early</th><th>Share</th></tr></thead><tbody>
    ${rows.map(([n, t]) => `<tr><td>${n}</td><td>${t.id}</td><td>${t.fault_s} s</td><td>${t.followed}</td><td>${t.too_early}</td><td><b class="${t.too_early === t.followed ? "off" : ""}">${Math.round(t.too_early / t.followed * 100)}%</b></td></tr>`).join("")}
    </tbody></table></div></div>
    <p>During the fault, agents also made ${D.amplification.agent.R_fault.toFixed(2)}× the attempts of a replay of their own healthy traffic. The scripted client made ${D.amplification.scripted.R_fault.toFixed(2)}×.</p>
    <h2>One lost goal, step by step</h2>
    <p>Goal ${R.goal} in ${R.trial} (20 s fault, gate on): ${refusals} refusals used up its tool budget just as the server recovered. The SQL oracle's verdict: <span class="pill fail">${R.verdict}</span>. This is the recorded sequence, with the model's visible text.</p>
    <p class="note pill" style="font-weight:400;margin-bottom:12px">That Retry-After behavior caused the lost goals is inference. No trial has tested a wait guard yet.</p>
    <div class="panel">${R.steps.map(s => s.kind === "http"
      ? `<div class="step"><time>${s.t.toFixed(1)} s</time><div>${esc(s.tool)} → <b class="${s.status === 200 ? "on" : "off"}">${s.status ?? esc(s.outcome)}</b>${s.retry_after ? ` · retry after ${s.retry_after} s` : ""}</div></div>`
      : `<div class="step"><time>${s.t.toFixed(1)} s</time><div class="say">"${esc(s.text)}"</div></div>`).join("")}</div>`;
  },

  bookings() {
    const arms = [["v1", "Original tools"], ["v2_time", "+ start-time filter"], ["v2_page", "+ pagination"]];
    const models = [...new Set(D.tools.map(r => r.model))];
    const cases = ["LATE_A", "LATE_B"];
    const cell = r => {
      const ok = r.class === "correct_booking";
      const label = ok ? `${r.booked} ✓` : r.class === "incorrect_booking" ? `${r.booked} booked` : r.class.includes("wrong_deferral") ? "Wrongly deferred" : "Ran out of budget";
      const fooled = r.class === "incorrect_booking" && r.old_oracle === "correct";
      return `<span class="pill ${ok ? "pass" : "fail"}">${label}</span>${fooled ? '<span class="wrongly">old oracle: "correct"</span>' : ""}`;
    };
    const count = a => D.tools.filter(r => r.arm === a && r.class === "correct_booking").length;
    const totalA = a => D.tools.filter(r => r.arm === a).length;
    return `<h1>The booking that returned 200 OK and was still wrong</h1>
    <p class="lead">A customer asked for 15:00 or later. The tool result was cut off at 4 KB, so no afternoon slot was ever visible. One model booked the morning anyway, the API accepted it, and the original date-only oracle called it correct.</p>
    <div class="cards">${arms.map(([a, n]) => `<div class="card"><div class="k">${n}</div><div class="v">${count(a)} of ${totalA(a)}</div><div class="s">correct afternoon bookings</div></div>`).join("")}</div>
    <div class="panel"><div class="scroll"><table><thead><tr><th>Local model</th><th>Task set</th>${arms.map(a => `<th>${a[1]}</th>`).join("")}</tr></thead><tbody>
    ${models.flatMap(m => cases.map(c => `<tr><td>${esc(m)}</td><td>${c.endsWith("A") ? "A" : "B (held out)"}</td>${arms.map(([a]) => `<td>${cell(D.tools.find(r => r.model === m && r.case === c && r.arm === a))}</td>`).join("")}</tr>`)).join("")}
    </tbody></table></div></div>
    <p><b>The fix belongs in the tool contract.</b> Let the request express the customer's constraint. Pagination leaves it to the model to look further, and only some models did. The oracle now checks stated constraints too.</p>
    <p class="foot">Separate study: local models, no fault and no gate, on fresh databases. Each cell is one deterministic run, so read this as direction, not a rate.</p>`;
  },

  evidence() {
    const headers = [["id","Trial"],["label","Arm"],["block","Block"],["fault_s","Fault"],["t_rec","Recovery (s)"],["lost","Lost requests"],["correct","Correct"],["goals","Goals"],["cost","Model cost ($)"],["status","Status"]];
    const bg = D.background;
    const bgOff = bg.filter(r => r.gate === "off"), bgOn = bg.filter(r => r.gate === "on");
    return `<h1>Every trial, nothing dropped</h1>
    <p class="lead">${T.length} of ${T.length} trials are valid and ${T.every(t => t.sums_ok) ? "every bundle matches its checksums" : "some bundles FAIL their checksums"}. Model spend $${D.spend.toFixed(2)}. From a fresh clone, with no model key, re-analysis reproduces every verdict.</p>
    <div class="panel"><div class="scroll"><table id="tbl"><thead><tr>${headers.map(h => `<th><button data-k="${h[0]}">${h[1]}</button></th>`).join("")}</tr></thead><tbody></tbody></table></div></div>
    <h2>Control: the same gate effect with no agents at all</h2>
    <p>In a separate campaign with background traffic only, lost requests went from ${span(bgOff, "lost")} to ${span(bgOn, "lost")}, and recovery from ${span(bgOff, "t_rec")} s to ${span(bgOn, "t_rec")} s. That's why the gate's benefit is a conventional overload effect, not an agent effect.</p>
    <h2>Limits</h2>
    <p>One API, one fault type, one gate setting, one model, one laptop. Three paired blocks, and a single pair for the 20 s fault. Agents were a small share of load. The 20 s gate-on trial ran with a lower spend cap, which never triggered. See <code>docs/limitations.md</code>.</p>
    <p class="foot">Built from recorded bundles at commit ${esc(D.commit)}. Verify: <code>make verify RUN=runs/eval-v1</code></p>`;
  },
};

function fillTable(key = "id", dir = 1) {
  const rows = [...T].sort((a, b) => (a[key] > b[key] ? 1 : a[key] < b[key] ? -1 : 0) * dir);
  $("#tbl tbody").innerHTML = rows.map(t => `<tr><td>${t.id}</td><td>${esc(t.label)}</td><td>${t.block || "—"}</td><td>${t.fault_on ? t.fault_s + " s" : "none"}</td><td>${t.t_rec ?? "—"}</td><td>${fmt(t.lost)}</td><td>${t.correct}</td><td>${t.goals}</td><td>${t.cost ? t.cost.toFixed(2) : "0"}</td><td><span class="pill ${t.status === "valid" && t.sums_ok ? "pass" : "fail"}">${t.status}${t.sums_ok ? "" : " · sums fail"}</span></td></tr>`).join("");
  document.querySelectorAll("#tbl th button").forEach(b => b.onclick = () => fillTable(b.dataset.k, b.dataset.k === key ? -dir : 1));
}

function chart(el, off, on, metric, faultS) {
  const W = 1040, H = 340, L = 62, R = 16, Y0 = 14, B = 34;
  const a = D.series[off.id], b = D.series[on.id];
  const [x0, x1] = D.window;
  const spec = {success: {label: "share of requests served", log: false, max: 1, f: v => (v * 100).toFixed(0) + "%", ticks: [0, .25, .5, .75, 1]},
    p95: {label: "milliseconds, log scale", log: true, max: 40000, f: v => v >= 1000 ? (v / 1000).toFixed(1) + " s" : v.toFixed(0) + " ms", ticks: [1, 10, 100, 1000, 10000]},
    inflight: {label: "requests", log: false, max: Math.ceil(Math.max(...a.inflight, ...b.inflight, 10) / 500) * 500, f: v => fmt(Math.round(v)), ticks: null}}[metric];
  const ticks = spec.ticks || [0, .25, .5, .75, 1].map(x => x * spec.max);
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R);
  const Yv = v => spec.log ? Math.log10(Math.max(v, 1)) / Math.log10(spec.max) : v / spec.max;
  const Y = v => H - B - Yv(v) * (H - B - Y0);
  const path = (s, k) => { let d = "", pen = false; s.t.forEach((t, i) => { const v = s[k][i]; if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + X(t).toFixed(1) + " " + Y(v).toFixed(1); pen = true; }); return d; };
  const onset = 180, end = 180 + faultS;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.label)} over time, gate off and on" style="width:100%;height:auto;display:block">
    <rect x="${X(onset)}" y="${Y0}" width="${X(end) - X(onset)}" height="${H - B - Y0}" fill="var(--band)"/>
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${spec.f(v)}</text>`).join("")}
    ${[150, 180, 210, 240, 270, 300, 330].map(t => `<text x="${X(t)}" y="${H - 12}" text-anchor="middle">${t} s</text>`).join("")}
    <path d="${path(a, metric)}" fill="none" stroke="var(--off)" stroke-width="2.2"/>
    <path d="${path(b, metric)}" fill="none" stroke="var(--on)" stroke-width="2.2"/>
    <line id="cross" y1="${Y0}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
    <rect id="hit" x="${L}" y="${Y0}" width="${W - L - R}" height="${H - B - Y0}" fill="transparent"/></svg>`;
  const svg = $("svg", el), hit = $("#hit", el), cross = $("#cross", el), tip = $("#tip");
  hit.onmousemove = e => {
    const r = svg.getBoundingClientRect(), t = Math.round(x0 + ((e.clientX - r.left) / r.width * W - L) / (W - L - R) * (x1 - x0));
    const i = a.t.indexOf(t), j = b.t.indexOf(t);
    if (i < 0 || j < 0) return;
    cross.setAttribute("x1", X(t)); cross.setAttribute("x2", X(t)); cross.setAttribute("visibility", "visible");
    tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 12, innerWidth - 190) + "px"; tip.style.top = e.clientY + 12 + "px";
    tip.textContent = `${t} s · off ${spec.f(a[metric][i] ?? 0)} · on ${spec.f(b[metric][j] ?? 0)}`;
  };
  hit.onmouseleave = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); };
}

function recoveryInit() {
  let run = "1", metric = "success";
  const draw = () => {
    const pair = run === "20" ? [off20, on20] : [agent("off", 10, +run), agent("on", 10, +run)];
    chart($("#chart"), pair[0], pair[1], metric, pair[0].fault_s);
    $("#p95note").style.display = metric === "p95" ? "block" : "none";
    const c = (k, a, b, s) => `<div class="card"><div class="k">${k}</div><div class="v"><span class="off">${a}</span> → <span class="on">${b}</span></div><div class="s">${s}</div></div>`;
    $("#runCards").innerHTML = c("Recovery time", pair[0].t_rec + " s", pair[1].t_rec + " s", `${pair[0].recovery} → ${pair[1].recovery}`)
      + c("Lost ordinary-user requests", fmt(pair[0].lost), fmt(pair[1].lost), `${pair[0].id} → ${pair[1].id}`)
      + c("Correct goals", pair[0].correct, pair[1].correct, `of ${pair[1].goals} scheduled`);
  };
  const bind = (id, set) => document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute("aria-pressed", x === b)); set(b.dataset.v); draw();
  });
  bind("runSeg", v => run = v); bind("metSeg", v => metric = v); draw();
}

const tabs = [["overview","Overview"],["recovery","Recovery"],["agents","Agent behavior"],["bookings","Bookings"],["evidence","Evidence"]];
function go(name) {
  if (!views[name]) name = "overview";
  $("#view").innerHTML = views[name]();
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === name));
  if (name === "recovery") recoveryInit();
  if (name === "evidence") fillTable();
  scrollTo(0, 0);
}
$("#nav").innerHTML = tabs.map(t => `<button role="tab" data-v="${t[0]}">${t[1]}</button>`).join("");
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { location.hash = b.dataset.v; });
addEventListener("hashchange", () => go(location.hash.slice(1)));
go(location.hash.slice(1) || "overview");
</script>
</body>
</html>
