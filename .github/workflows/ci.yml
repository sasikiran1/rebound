name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check .
      - name: pytest
        run: uv run pytest -q
      - name: resolve modules import (product, service, evaluation)
        run: uv run python -c "import resolve.ui, resolve.worker, resolve.models, resolve.eval.run, resolve.eval.faults, resolve.eval.demo"
      - name: compose file is valid, including the resolve profile
        run: docker compose -f docker/compose.yml --profile resolve config -q
      - name: no artificial delays in backend/
        run: |
          if grep -rni "sleep" backend/; then
            echo "::error::'sleep' found in backend/"
            exit 1
          fi
