- id: D1
  kind: permission
  title: First choice taken during the outage; next week needs permission; reply corrects the time
  customer: Maya Chen
  technicians: {dana: Dana Okafor, alex: Alex Rivera}
  history: [{date: 2026-10-06, time: "10:00", tech: dana}]
  current: tue 09:00 alex
  open: [fri 15:30 dana, fri 10:00 alex, mon2 15:00 alex, mon2 16:30 alex, mon2 09:00 dana, wed 11:00 dana]
  taken: [fri 15:30 dana]
  messages:
    - "I need someone after three this week. Dana if possible. Don't push it into next week without checking with me."
  replies:
    - "Monday is okay, but not before four."
  expected:
    authorized: [[fri 15:30 dana], [fri 15:30 dana, mon2 16:30 alex]]
    final: [mon2 16:30 alex]
    questions: 1
  form:
    rules:
      - {kind: dates_between, date_from: 2026-11-10, date_to: 2026-11-13}
      - {kind: start_at_or_after, time: "15:00"}
      - {kind: technician_is, technician_ids: [dana], strength: prefer}
  form_turns:
    - rules:
        - {kind: dates_between, date_from: 2026-11-10, date_to: 2026-11-16}
        - {kind: start_at_or_after, time: "15:00"}
        - {kind: start_at_or_after, time: "16:00", only_on_dates: [2026-11-16]}
        - {kind: technician_is, technician_ids: [dana], strength: prefer}

