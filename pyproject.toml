[project]
name = "rebound"
version = "0.1.0"
description = "Resolve: a scheduling-recovery service where Muse Spark proposes, code decides what may be booked, and SQL checks the result."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg",
    "httpx",
    "jsonschema",
    "openai",
    "pydantic",
    "pyyaml",
]

[dependency-groups]
# Installed alone in the fielddesk container (`uv sync --only-group backend`).
backend = [
    "asyncpg",
    "fastapi",
    "uvicorn",
]
# A CalDAV server (Radicale) for the technicians' calendars, locally and in the resolve-calendar container.
calendar = [
    "radicale>=3.9.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    { include-group = "backend" },
    { include-group = "calendar" },
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# Small one-off file reads in async setup code are fine.
ignore = ["ASYNC240"]
